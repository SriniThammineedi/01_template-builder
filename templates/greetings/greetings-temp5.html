<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Promotion Template-5</title>

        <link rel="stylesheet" href="./assets/css/greeting-templates.css">

        <!-- Google Fonts Declaration -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Doppio+One&family=Birthstone&family=Oswald:wght@200..700&family=Bowlby+One&family=Petemoss&display=swap"
            rel="stylesheet" />

        <!-- Telugu Fonts -->
        <link
            href="https://fonts.googleapis.com/css2?family=Akaya+Telivigala&family=Chathura:wght@100;300;400;700;800&family=Dhurjati&family=Gurajada&family=Lakki+Reddy&family=Mallanna&family=Mandali&family=NTR&family=Ramabhadra&family=Tiro+Telugu:ital@0;1&family=Anek+Telugu:wght@100..800&display=swap"
            rel="stylesheet">
    </head>

    <body>
        <div id="themeOuter">
            <!-- Greetings Template-5 Start -->
            <div class="template-wrapper" id="greetings-template-5"
                style="background-image: url(../../assets/images/back-bg-55.jpg);">

                <!-- Template Header -->
                <div id="temp-header">
                    <div class="greet5Head">
                        <div class="imgHolder topDecor">
                            <img id="top-decor" src="./assets/images/top-decor-16.png" alt="">
                            <input name="decor" type="file" accept="image/*"
                                onchange="document.getElementById('top-decor').src = window.URL.createObjectURL(this.files[0])">
                        </div>
                        <h1 class="selectable" contenteditable="true" data-options="editOptions">
                            సంక్రాంతి శుభాకాంక్షలు
                        </h1>
                        <p>Proprietor: Dhana Lakshmi K</p>
                    </div>
                </div>

                <!-- Template Body Section -->
                <div id="temp-body">
                    <div class="greet5Body">
                        <h2 class="selectable fullWidthBg" contenteditable="true" data-options="editOptions"> <img
                                src="./assets/images/virat-fashions-logo.png" alt=""> విరాట్ ఫ్యాషన్స్</h2>
                        <div class="side-by-side">
                            <h1 class="selectable" contenteditable="true" data-options="editOptions">Virat
                                <span>Fashions</span> <em>Dressing well is a form of good manners.....</em>
                            </h1>
                            <div class="imgHolder selectable">
                                <img id="childImg" src="./assets/images/vf-child.jpg" alt="">
                                <input name="child" type="file" accept="image/*"
                                    onchange="document.getElementById('childImg').src = window.URL.createObjectURL(this.files[0])">
                            </div>
                        </div>
                        <div class="show-in-row">
                            <div class="imgHolder selectable">
                                <img id="clothesOne" src="./assets/images/vf-clothes1.jpg" alt="">
                                <input name="clothes1" type="file" accept="image/*"
                                    onchange="document.getElementById('clothesOne').src = window.URL.createObjectURL(this.files[0])">
                            </div>
                            <div class="imgHolder selectable">
                                <img id="clothesTwo" src="./assets/images/vf-clothes2.jpg" alt="">
                                <input name="clothes2" type="file" accept="image/*"
                                    onchange="document.getElementById('clothesTwo').src = window.URL.createObjectURL(this.files[0])">
                            </div>
                            <div class="imgHolder selectable">
                                <img id="clothesThree" src="./assets/images/vf-clothes3.jpg" alt="">
                                <input name="clothes3" type="file" accept="image/*"
                                    onchange="document.getElementById('clothesThree').src = window.URL.createObjectURL(this.files[0])">
                            </div>
                        </div>
                        <div class="show-in-row">
                            <div class="imgHolder selectable sideDecor">
                                <img id="leftDecor" src="./assets/images/pongal-pot-2.png" alt="">
                                <input name="ldecor" type="file" accept="image/*"
                                    onchange="document.getElementById('leftDecor').src = window.URL.createObjectURL(this.files[0])">
                            </div>
                            <div class="imgHolder selectable">
                                <img id="clothesFour" src="./assets/images/vf-clothes4.jpg" alt="">
                                <input name="clothes4" type="file" accept="image/*"
                                    onchange="document.getElementById('clothesFour').src = window.URL.createObjectURL(this.files[0])">
                            </div>
                            <div class="imgHolder selectable">
                                <img id="clothesFive" src="./assets/images/vf-clothes5.jpg" alt="">
                                <input name="clothes5" type="file" accept="image/*"
                                    onchange="document.getElementById('clothesFive').src = window.URL.createObjectURL(this.files[0])">
                            </div>
                            <div class="imgHolder selectable sideDecor">
                                <img id="rightDecor" src="./assets/images/pongal-pot.png" alt="">
                                <input name="rdecor" type="file" accept="image/*"
                                    onchange="document.getElementById('rightDecor').src = window.URL.createObjectURL(this.files[0])">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Template Footer Section -->
                <div id="temp-footer">
                    <div class="greet5Footer">
                        <p class="selectable address" contenteditable="true" data-options="editOptions">#6-459, Beside
                            VIRAT CUTZ, Kalikiri-517234.
                        </p>
                        <p class="selectable contact" contenteditable="true" data-options="editOptions">8639 902995,
                            94940 77282
                        </p>
                    </div>
                </div>
            </div>
            <!-- Greetings Template-5 End -->
        </div>
    </body>

</html>
