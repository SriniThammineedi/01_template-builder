<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Retirement Template-5</title>

        <link rel="stylesheet" href="/assets/css/retirement-templates.css">

        <!-- Google Fonts Declaration -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Doppio+One&family=Birthstone&family=Oswald:wght@200..700&family=Bowlby+One&family=Bonheur+Royale&family=Rakkas&family=Alike&family=Praise&display=swap"
            rel="stylesheet" />

        <!-- Telugu Fonts -->
        <link
            href="https://fonts.googleapis.com/css2?family=Akaya+Telivigala&family=Chathura:wght@100;300;400;700;800&family=Dhurjati&family=Gurajada&family=Lakki+Reddy&family=Mallanna&family=Mandali&family=NTR&family=Ramabhadra&family=Tiro+Telugu:ital@0;1&family=Anek+Telugu:wght@100..800&family=Ponnala&&family=Ramaraja&display=swap"
            rel="stylesheet">
    </head>

    <body>
        <div id="themeOuter">

            <!-- Retirement Template 5 Start -->
            <div class="template-wrapper" id="retirement-temp-5"
                style="background-image: url(/assets/images/back-bg-74.jpg);">

                <!-- Template Header -->
                <div id="temp-header">
                    <div class="retr5Head">
                        <h1 class="selectable" contenteditable="true" data-options="editOptions"><span>పదవీ విరమణ</span>
                            శుభాకాంక్షలు
                        </h1>
                    </div>
                </div>

                <!-- Template Body Section -->
                <div id="temp-body">
                    <div class="retr5Body">
                        <div class="imgHolder selectable">
                            <img id="main-photo" src="/assets/images/retirement-man-1.jpg" alt="" class="selectable">
                            <input name="main" type="file" accept="image/*"
                                onchange="document.getElementById('main-photo').src = window.URL.createObjectURL(this.files[0])" />
                        </div>
                        <p class="selectable" contenteditable="true" data-options="editOptions">30 సంవత్సరాలుగా
                            నీటిపారుదల శాఖలో ఇంజనీర్ గా అమూల్యమైన సేవలు అందించి నేడు పదవీ విరమణ పొందుతున్న సందర్భంగా
                        </p>
                        <h1 class="selectable" contenteditable="true" data-options="editOptions">శ్రీ విజయరాజు గారికి
                            <span>మా శుభాకాంక్షలు</span>
                        </h1>
                    </div>
                </div>
            </div>
            <!-- Retirement Template 5 End -->

        </div>
    </body>

</html>
