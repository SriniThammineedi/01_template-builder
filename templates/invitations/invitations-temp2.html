<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Invitations Template-2</title>

        <link rel="stylesheet" href="/assets/css/political-templates.css">

        <!-- Google Fonts Declaration -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Doppio+One&family=Birthstone&family=Oswald:wght@200..700&family=Bowlby+One&display=swap"
            rel="stylesheet" />

        <!-- Telugu Fonts -->
        <link
            href="https://fonts.googleapis.com/css2?family=Akaya+Telivigala&family=Chathura:wght@100;300;400;700;800&family=Dhurjati&family=Gurajada&family=Lakki+Reddy&family=Mallanna&family=Mandali&family=NTR&family=Ramabhadra&family=Tiro+Telugu:ital@0;1&family=Anek+Telugu:wght@100..800&display=swap"
            rel="stylesheet">
    </head>

    <body>
        <div id="themeOuter">
            <!-- Invitations Template 2 Start -->
            <div class="template-wrapper" id="invitations-template-2"
                style="background-image: url(../../assets/images/back-bg-97.jpg);">

                <!-- Template Header -->
                <div id="temp-header">
                    <div class="invit2Head">
                        <div class="imgHolder selectable">
                            <img id="ganeshArt" src="../../assets/images/ganapathy-clipart2.png" alt="" />
                            <input name="clipart" type="file" accept="image/*"
                                onchange="document.getElementById('ganeshArt').src = window.URL.createObjectURL(this.files[0])" />
                        </div>
                        <h1 class="selectable" contenteditable="true" data-options="editOptions">
                            నిశ్చితార్థ ఆహ్వానము</h1>
                    </div>
                </div>

                <!-- Template Body Section -->
                <div id="temp-body">
                    <div class="invit2Body">
                        <div class="imgHolder selectable">
                            <img id="mainPhoto" src="../../assets/images/wedding-pair-with-bg-3.jpg" alt="" />
                            <input name="main" type="file" accept="image/*"
                                onchange="document.getElementById('mainPhoto').src = window.URL.createObjectURL(this.files[0])" />
                        </div>
                        <h1 class="selectable" contenteditable="true" data-options="editOptions">రాజు - రాణి
                        </h1>
                    </div>
                </div>

                <!-- Template Footer Section -->
                <div id="temp-footer">
                    <div class="invit2Footer">
                        <h3 class="selectable" contenteditable="true" data-options="editOptions">తేదీ: 03-04-2024, 10:30
                            am</h3>
                        <h5 class="selectable" contenteditable="true" data-options="editOptions">తప్పక హాజరై మా ఆతిథ్యం
                            స్వీకరించగలరు</h5>
                        <p class="selectable" contenteditable="true" data-options="editOptions">వేదిక: మా స్వగృహం నందు,
                            వరంగల్</p>
                        <div class="imgHolder selectable">
                            <img id="kalasham" src="../../assets/images/kalasham2.png" alt="" />
                            <input name="kalash" type="file" accept="image/*"
                                onchange="document.getElementById('kalasham').src = window.URL.createObjectURL(this.files[0])" />
                        </div>
                    </div>
                </div>
            </div>
            <!-- Invitations Template 2 End -->
        </div>
    </body>

</html>
