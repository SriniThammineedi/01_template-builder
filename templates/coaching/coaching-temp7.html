<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rankers Template-1</title>

        <!-- Google Fonts Declaration -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Doppio+One&family=Birthstone&family=Oswald:wght@200..700&family=Bowlby+One&family=Graduate&display=swap"
            rel="stylesheet" />

        <!-- Telugu Fonts -->
        <link
            href="https://fonts.googleapis.com/css2?family=Akaya+Telivigala&family=Chathura:wght@100;300;400;700;800&family=Dhurjati&family=Gurajada&family=Lakki+Reddy&family=Mallanna&family=Mandali&family=NTR&family=Ramabhadra&family=Tiro+Telugu:ital@0;1&family=Anek+Telugu:wght@100..800&display=swap"
            rel="stylesheet">

        <link rel="stylesheet" href="./assets/css/coaching-templates.css">
    </head>

    <body>
        <div id="themeOuter">
            <!-- Rankers Template-1 Start -->
            <div class="template-wrapper" id="coaching-template-7"
                style="background-image: url(./assets/images/back-bg-105.jpg);">
                <!-- Template Header -->
                <div id="temp-header">
                    <div class="coach7Head">
                        <div class="imgHolder selectable">
                            <img id="brLogo" src="./assets/images/established-logo.png" alt="">
                            <input name="logo" type="file" accept="image/*"
                                onchange="document.getElementById('brLogo').src = window.URL.createObjectURL(this.files[0])">
                        </div>
                        <h1 class="selectable withBg" contenteditable="true" data-options="editOptions">టాపర్స్
                            ఇన్స్టిట్యూట్ అఫ్ టెక్నాలజీ
                        </h1>
                    </div>
                </div>

                <!-- Template Body Section -->
                <div id="temp-body">
                    <div class="coach7Body">
                        <h2 class="selectable" contenteditable="true" data-options="editOptions">
                            <span>తెలంగాణ స్టేట్</span> EAPCET ఫలితాల్లో
                        </h2>
                        <div class="side-by-side">
                            <h1 class="selectable" contenteditable="true" data-options="editOptions">
                                1<sup>st</sup> <span>Rank</span>
                            </h1>
                            <div class="guestCard">
                                <div class="imgHolder selectable">
                                    <img id="mainPhoto" src="./assets/images/ranker-student1.png" alt="">
                                    <input name="main" type="file" accept="image/*"
                                        onchange="document.getElementById('mainPhoto').src = window.URL.createObjectURL(this.files[0])">
                                </div>
                                <h2 class="selectable withBg" contenteditable="true" data-options="editOptions">Saiteja
                                    Varanasi <span>HT.No. 2024E06002</span>
                                </h2>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Template Footer Section -->
                <div id="temp-footer">
                    <div class="coach7Footer">
                        <h3 class="selectable" contenteditable="true" data-options="editOptions">
                            <span>Congratulations</span> To Parents And Staff
                        </h3>
                        <h4 class="selectable" contenteditable="true" data-options="editOptions">- టాపర్స్ ఇన్స్టిట్యూట్
                            -</h4>
                    </div>
                </div>
            </div>
            <!-- Coaching Template-6 End -->
        </div>
    </body>

</html>
