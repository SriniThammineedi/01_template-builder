<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Holi 4</title>

        <link rel="stylesheet" href="./assets/css/events-templates.css">

        <!-- Google Fonts Declaration -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Doppio+One&family=Birthstone&family=Oswald:wght@200..700&family=Bowlby+One&family=Bonheur+Royale&family=Rakkas&family=Alike&family=Praise&family=Petemoss&family=Teko:wght@300..700&family=Graduate&family=Squada+One&display=swap"
            rel="stylesheet" />

        <!-- Telugu Fonts -->
        <link
            href="https://fonts.googleapis.com/css2?family=Akaya+Telivigala&family=Chathura:wght@100;300;400;700;800&family=Dhurjati&family=Gurajada&family=Lakki+Reddy&family=Mallanna&family=Mandali&family=NTR&family=Ramabhadra&family=Tiro+Telugu:ital@0;1&family=Anek+Telugu:wght@100..800&family=Ponnala&&family=Ramaraja&display=swap"
            rel="stylesheet">
    </head>

    <body>
        <div id="themeOuter">
            <!-- Event Template-17 (Holi 4) Start -->
            <div class="template-wrapper" id="event-template-17"
                style="background-image: url(./assets/images/back-bg-91.jpg);">
                <!-- Template Header -->
                <div id="temp-header">
                    <div class="event17Head">
                        <div class="imgHolder selectable">
                            <img id="holiCeleb" src="./assets/images/holi-celebration2.png" alt="" />
                            <input name="holi" type="file" accept="image/*"
                                onchange="document.getElementById('holiKids').src = window.URL.createObjectURL(this.files[0])" />
                        </div>
                        <h1 class="selectable" contenteditable="true" data-options="editOptions">Happy Holi</h1>
                    </div>
                </div>

                <!-- Template Body Section -->
                <div id="temp-body">
                    <div class="event17Body">
                        <div class="imgHolder selectable brandLogo">
                            <img id="brLogo" src="./assets/images/kaja-restaurant-logo.png" alt="" />
                            <input name="logo" type="file" accept="image/*"
                                onchange="document.getElementById('brLogo').src = window.URL.createObjectURL(this.files[0])" />
                        </div>
                        <div class="imgHolder selectable hotelView">
                            <img id="restView" src="./assets/images/kaja-restaurant-photo.png" alt="" />
                            <input name="restaurant" type="file" accept="image/*"
                                onchange="document.getElementById('restView').src = window.URL.createObjectURL(this.files[0])" />
                        </div>
                        <h2 class="selectable" contenteditable="true" data-options="editOptions"><span>పసందైన
                                భోజనం..</span> KAJA లో మాత్రమే!</h2>
                        <div class="imgHolder selectable hotelOuterView">
                            <img id="restBuilding" src="./assets/images/kaja-restaurant-building.jpg" alt="" />
                            <input name="build" type="file" accept="image/*"
                                onchange="document.getElementById('restBuilding').src = window.URL.createObjectURL(this.files[0])" />
                        </div>
                    </div>
                </div>

                <!-- Template Footer Section -->
                <div id="temp-footer">
                    <div class="event17Footer">
                        <div class="side-by-side">
                            <div class="imgHolder selectable">
                                <img id="dishOne" src="./assets/images/kaja-dish1.jpg" alt="" />
                                <input name="one" type="file" accept="image/*"
                                    onchange="document.getElementById('dishOne').src = window.URL.createObjectURL(this.files[0])" />
                            </div>
                            <div class="imgHolder selectable">
                                <img id="dishTwo" src="./assets/images/kaja-dish2.jpg" alt="" />
                                <input name="two" type="file" accept="image/*"
                                    onchange="document.getElementById('dishTwo').src = window.URL.createObjectURL(this.files[0])" />
                            </div>
                            <div class="imgHolder selectable">
                                <img id="dishThree" src="./assets/images/kaja-dish3.jpg" alt="" />
                                <input name="three" type="file" accept="image/*"
                                    onchange="document.getElementById('dishThree').src = window.URL.createObjectURL(this.files[0])" />
                            </div>
                            <div class="imgHolder selectable">
                                <img id="dishFour" src="./assets/images/kaja-dish4.jpg" alt="" />
                                <input name="four" type="file" accept="image/*"
                                    onchange="document.getElementById('dishFour').src = window.URL.createObjectURL(this.files[0])" />
                            </div>
                            <div class="imgHolder selectable">
                                <img id="dishFive" src="./assets/images/kaja-dish5.jpg" alt="" />
                                <input name="five" type="file" accept="image/*"
                                    onchange="document.getElementById('dishFive').src = window.URL.createObjectURL(this.files[0])" />
                            </div>
                        </div>
                        <h2 class="selectable withBg" contenteditable="true" data-options="editOptions">ఇండియన్ | చైనీస్
                            | తండూరి | బిర్యానీ</h2>
                        <p class="selectable" contenteditable="true" data-options="editOptions">P.LEVIDI Village, Near
                            GCC Petrol Bunk, G. L. Poram Road</p>
                        <p class="selectable contactClickable" contenteditable="true" data-options="editOptions">
                            8500895565, 8330928627</p>
                    </div>
                </div>
            </div>
            <!-- Event Template-17 (Holi 4) End -->
        </div>
    </body>

</html>
