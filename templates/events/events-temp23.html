<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ugadi 3</title>

        <link rel="stylesheet" href="/assets/css/events-templates.css">

        <!-- Google Fonts Declaration -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Doppio+One&family=Birthstone&family=Oswald:wght@200..700&family=Bowlby+One&family=Bonheur+Royale&family=Rakkas&family=Alike&family=Praise&family=Petemoss&family=Teko:wght@300..700&family=Graduate&family=Squada+One&display=swap"
            rel="stylesheet" />

        <!-- Telugu Fonts -->
        <link
            href="https://fonts.googleapis.com/css2?family=Akaya+Telivigala&family=Chathura:wght@100;300;400;700;800&family=Dhurjati&family=Gurajada&family=Lakki+Reddy&family=Mallanna&family=Mandali&family=NTR&family=Ramabhadra&family=Tiro+Telugu:ital@0;1&family=Anek+Telugu:wght@100..800&family=Ponnala&&family=Ramaraja&display=swap"
            rel="stylesheet">
    </head>

    <body>
        <div id="themeOuter">
            <!-- Event Template-23 (Ugadi 3 [Ambica Jewellers]) Start -->
            <div class="template-wrapper" id="event-template-23"
                style="background-image: url(../../assets/images/back-bg-107.jpg);">
                <!-- Template Header -->
                <div id="temp-header">
                    <div class="event23Head">
                        <div class="imgHolder selectable topDecor">
                            <img id="tpDecor" src="../../assets/images/top-decor-25.png" alt="" />
                            <input name="decor" type="file" accept="image/*"
                                onchange="document.getElementById('tpDecor').src = window.URL.createObjectURL(this.files[0])" />
                        </div>
                        <h4 class="selectable" contenteditable="true" data-options="editOptions">ప్రియమైన మా
                            ఖాతాదారులకు, మిత్రులకు, శ్రేయోభిలాషులకు, ఆడపడుచులకు</h4>

                        <div class="titleWithThumbs">
                            <div class="imgHolder selectable imgLS">
                                <img id="ugadiImg" src="../../assets/images/ugadi-kalasham.png" alt="">
                                <input name="kalasham" type="file" accept="image/*"
                                    onchange="document.getElementById('ugadiImg').src = window.URL.createObjectURL(this.files[0])">
                            </div>
                            <h1 class="selectable" contenteditable="true" data-options="editOptions">శ్రీ విశ్వావసు నామ
                                సంవత్సర ఉగాది శుభాకాంక్షలు.
                            </h1>
                            <div class="imgHolder selectable imgRS">
                                <img id="ugadiImg2" src="../../assets/images/ugadi-kalasham2.png" alt="">
                                <input name="kalasham2" type="file" accept="image/*"
                                    onchange="document.getElementById('ugadiImg2').src = window.URL.createObjectURL(this.files[0])">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Template Body Section -->
                <div id="temp-body">
                    <div class="event23Body">
                        <div class="side-by-side">
                            <div class="imgHolder selectable">
                                <img id="jewelOne" src="../../assets/images/ambika-jewel1.jpg" alt="">
                                <input name="jewelry1" type="file" accept="image/*"
                                    onchange="document.getElementById('jewelOne').src = window.URL.createObjectURL(this.files[0])">
                            </div>
                            <div class="imgHolder selectable">
                                <img id="jewelTwo" src="../../assets/images/ambika-jewel2.jpg" alt="">
                                <input name="jewelry2" type="file" accept="image/*"
                                    onchange="document.getElementById('jewelTwo').src = window.URL.createObjectURL(this.files[0])">
                            </div>
                            <div class="imgHolder selectable">
                                <img id="jewelThree" src="../../assets/images/ambika-jewel3.jpg" alt="">
                                <input name="jewelry3" type="file" accept="image/*"
                                    onchange="document.getElementById('jewelThree').src = window.URL.createObjectURL(this.files[0])">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Template Footer Section -->
                <div id="temp-footer">
                    <div class="event23Footer"></div>
                </div>
            </div>
            <!-- Event Template-23 (Ugadi 2[Ambika Jewellers]) End -->
        </div>
    </body>

</html>
