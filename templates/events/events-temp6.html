<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Womens Day 2</title>

        <link rel="stylesheet" href="/assets/css/events-templates.css">

        <!-- Google Fonts Declaration -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Doppio+One&family=Birthstone&family=Oswald:wght@200..700&family=Bowlby+One&family=Bonheur+Royale&family=Rakkas&family=Alike&family=Praise&family=Petemoss&family=Graduate&display=swap"
            rel="stylesheet" />

        <!-- Telugu Fonts -->
        <link
            href="https://fonts.googleapis.com/css2?family=Akaya+Telivigala&family=Chathura:wght@100;300;400;700;800&family=Dhurjati&family=Gurajada&family=Lakki+Reddy&family=Mallanna&family=Mandali&family=NTR&family=Ramabhadra&family=Tiro+Telugu:ital@0;1&family=Anek+Telugu:wght@100..800&family=Ponnala&&family=Ramaraja&display=swap"
            rel="stylesheet">
    </head>

    <body>
        <div id="themeOuter">
            <!-- Event Template-6 (Womens Day 2) Start -->
            <div class="template-wrapper" id="event-template-6"
                style="background-image: url(/assets/images/back-bg-80.jpg);">
                <!-- Template Header -->
                <div id="temp-header">
                    <div class="event6Head">
                        <h1 class="selectable" contenteditable="true" data-options="editOptions">అంతర్జాతీయ
                            మహిళా దినోత్సవ <span>శుభాకాంక్షలు</span>
                        </h1>
                    </div>
                </div>

                <!-- Template Body Section -->
                <div id="temp-body">
                    <div class="event6Body">
                        <div class="imgHolder selectable">
                            <img id="womanArt" src="/assets/images/woman-clipart-2.png" alt="" />
                            <input name="woman" type="file" accept="image/*"
                                onchange="document.getElementById('womanArt').src = window.URL.createObjectURL(this.files[0])" />
                        </div>
                        <h2 class="selectable" contenteditable="true" data-options="editOptions">యత్ర నార్యంతు పూజ్యంతే
                            తత్ర దేవతా - స్త్రీ <span>ఎక్కడ గౌరవించబడుతుందో అక్కడ దేవతలు ఉంటారు</span>
                        </h2>
                        <h1 class="selectable withBg" contenteditable="true" data-options="editOptions">అంతర్జాతీయ మహిళా
                            దినోత్సవ <span>శుభాకాంక్షలు</span>
                        </h1>
                    </div>
                </div>

                <!-- Template Footer Section -->
                <div id="temp-footer">
                    <div class="event6Footer">
                        <div class="side-by-side">
                            <div class="imgHolder selectable">
                                <img id="mainImg" src="/assets/images/woman-photo-2.jpg" alt="" />
                                <input name="main" type="file" accept="image/*"
                                    onchange="document.getElementById('mainImg').src = window.URL.createObjectURL(this.files[0])" />
                            </div>
                            <h2 class="selectable" contenteditable="true" data-options="editOptions">
                                <span>శ్రీమతి</span> A. సులోచనా రాణి <b>తహశీల్దార్</b> <em>రామభద్రాపురం మండలం</em>
                            </h2>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Event Template-6 (Womens Day 2) End -->
        </div>
    </body>

</html>
