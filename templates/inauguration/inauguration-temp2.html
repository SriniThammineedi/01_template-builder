<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inauguration Template-2</title>

        <link rel="stylesheet" href="/assets/css/inauguration-templates.css">

        <!-- Google Fonts Declaration -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Doppio+One&family=Birthstone&family=Oswald:wght@200..700&family=Bowlby+One&display=swap"
            rel="stylesheet" />

        <!-- Telugu Fonts -->
        <link
            href="https://fonts.googleapis.com/css2?family=Akaya+Telivigala&family=Chathura:wght@100;300;400;700;800&family=Dhurjati&family=Gurajada&family=Lakki+Reddy&family=Mallanna&family=Mandali&family=NTR&family=Ramabhadra&family=Tiro+Telugu:ital@0;1&family=Anek+Telugu:wght@100..800&display=swap"
            rel="stylesheet">
    </head>

    <body>
        <div id="themeOuter">
            <!-- Inauguration Template-2 Start -->
            <div class="template-wrapper" id="inauguration-temp-2"
                style="background-image: url(/assets/images/back-bg-62.jpg);">
                <!-- Template Header -->
                <div id="temp-header">
                    <div class="inaug2Head">
                        <div class="imgHolder selectable topDecor">
                            <img id="tpDecor" src="/assets/images/top-decor-19.png" alt="" />
                            <input name="decor" type="file" accept="image/*"
                                onchange="document.getElementById('tpDecor').src = window.URL.createObjectURL(this.files[0])" />
                        </div>
                        <h1 class="selectable" contenteditable="true" data-options="editOptions">
                            నూతన ప్రారంభోత్సవ <span>ఆహ్వానం"</span>
                        </h1>
                    </div>
                </div>

                <!-- Template Body Section -->
                <div id="temp-body">
                    <div class="inaug2Body">
                        <h5 class="selectable withBg" contenteditable="true" data-options="editOptions">తేది 27-11-2024
                            బుధవారం</h5>
                        <p class="selectable" contenteditable="true" data-options="editOptions">ఉదయం 10:30 నిమిషాలకు
                            భీమవరం, పద్మలయ థియేటర్ ఎదురు రోడ్ రామాలయం గుడి ఎదురు సందు</p>
                    </div>
                </div>

                <!-- Template Footer Section -->
                <div id="temp-footer">
                    <div class="inaug2Footer">
                        <div class="imgHolder leftVector selectable">
                            <img id="tree-1" src="/assets/images/replacable-photo.jpg" alt="" />
                            <input name="tree1" type="file" accept="image/*"
                                onchange="document.getElementById('tree-1').src = window.URL.createObjectURL(this.files[0])" />
                        </div>
                        <p class="address selectable" contenteditable="true" data-options="editOptions">డో. నెం:
                            46-18-10.
                            వై . ఎస్. ఆర్. - జక్కంపూడి బ్లడ్ బ్యాంక్ పైన, బొమ్మిరెడ్డి శ్రీనివాస్ హాస్పిటల్ ఎదురుగా,
                            దానవాయిపేట, రాజమహేంద్రవరం.</p>
                        <p class="contact selectable" contenteditable="true" data-options="editOptions">సెల్: 98482
                            41555,
                            96667 98444</p>
                    </div>
                </div>
            </div>
            <!-- Inauguration Template-1 End -->
        </div>
    </body>

</html>
